spring.application.name=hotel-reservation-system
server.port=8080

spring.datasource.url=jdbc:sqlite:hotel.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Set these as environment variables before using email OTP.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Use a long random secret (at least 32 characters) in your environment.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=60
app.otp.expiration-minutes=10
app.otp.max-attempts=5

# Cloudflare Turnstile. For local development, CAPTCHA is disabled until configured.
app.captcha.enabled=${CAPTCHA_ENABLED:false}
app.captcha.secret=${CAPTCHA_SECRET:}
app.captcha.verify-url=https://challenges.cloudflare.com/turnstile/v0/siteverify

# Configure the allowed frontend origin for your project.
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5500}
